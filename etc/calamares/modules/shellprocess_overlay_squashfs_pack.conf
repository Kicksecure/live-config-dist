---
## Pack the live root overlayfs upperdir into the supplementary overlay squashfs
## that the next unpackfs entry layers onto the install. dontChroot: true so it
## runs in the live environment and writes the live path unpackfs reads next.
## DEVELOPER OPT-IN: a no-op (exit 0) unless DEVOVERLAY is truthy in
## the environment (preserved across the installer's privilege escalation, e.g.
## sudo -E), so a normal user's install is unaffected. Also a clean no-op if the
## root is not an overlay. Never fails the install.
dontChroot: true
timeout: 1800
script:
    - overlay-squashfs-pack --from-overlay
