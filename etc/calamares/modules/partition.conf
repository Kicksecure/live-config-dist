## https://github.com/calamares/calamares/blob/calamares/src/modules/partition/partition.conf
## https://github.com/bbqlinux/calamares-bbqlinux/blob/master/src/etc/calamares/modules/partition.conf

## Size? See:
## https://github.com/grml/grml-debootstrap/issues/221

## OPT-IN LIVE PERSISTENCE CAVEAT (manual disk selection):
## The opt-in live-persistence feature stores a full-root read-write overlay on a
## SECOND disk labeled 'persistence' (provisioned in a live session via
## 'persistence-setup'). When installing to disk with Calamares, the user must pick
## the intended install target (disk 1) and must NOT select the 'persistence' disk --
## installing over it destroys the persistent overlay and its data. There is no
## automatic exclusion yet; selection is manual. See the 'Persistent' GRUB submenu note.

efi:
    mountPoint:         "/boot/efi"
    recommendedSize:    550MiB
    minimumSize:        550MiB
    label:              "EFI"

userSwapChoices:
    - none

drawNestedPartitions: false
alwaysShowPartitionLabels: true
defaultFileSystemType: "ext4"
availableFileSystemTypes: ["ext4", "btrfs"]
luksGeneration: luks2
preCheckEncryption: true

allowManualPartitioning: true

partitionLayout:
     - name: "boot"
       filesystem: "unknown"
       mountPoint: "/boot"
       size: 4G
       minSize: 2G
       noEncrypt: true
     - name: "rootfs"
       filesystem: "unknown"
       mountPoint: "/"
       size: 100%
       minSize: 8G
